<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawing Board</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #c7d3c0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 25px;
        gap: 20px;
      }

      #drawing-board {
        width: 75vw;
        height: 75vh;
        background: #e8f5e9;
        border: 2px solid gray;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
      }

      .drawing {
        width: 10px;
        height: 10px;
        background: red;
        position: absolute;
        border-radius: 50%;
      }

      .controls {
        width: 75vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 15px 20px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button {
        padding: 8px 18px;
        border: none;
        border-radius: 8px;
        background: #ef5350;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #d32f2f;
      }

      input[type="range"] {
        width: 180px;
        cursor: pointer;
      }

      input[type="color"] {
        width: 40px;
        height: 40px;
        border: none;
        cursor: pointer;
        background: none;
      }
      .header {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 30px 0;
      }
      .title {
        font-size: 28px;
        font-weight: 500;
      }
      .theme-buttons {
        display: flex;
        gap: 18px;
      }
      .theme-buttons button {
        padding: 12px 18px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        font-size: 18px;
        transition: 0.3s;
      }
      #dark-btn {
        background: black;
        color: white;
      }
      #light-btn {
        background: white;
        color: black;
      }
      #bw-btn {
        background: gray;
        color: white;
      }
      .theme-buttons button:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <header class="header">
    <span class="title">Change Theme :</span>
    <div class="theme-buttons">
      <button id="dark-btn">Dark</button>
      <button id="light-btn">Light</button>
      <button id="bw-btn">Black & White</button>
    </div>
  </header>
  <body>
    <div id="drawing-board"></div>

    <div class="controls">
      <button id="clear-board">Clear</button>

      <div class="control-group">
        <strong>Brush Size</strong>
        <input type="range" id="slider" min="0" max="50" value="10" />
      </div>

      <div class="control-group">
        <label for="colorPicker"><strong>Color</strong></label>
        <input type="color" id="colorPicker" value="#ff0000" />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
