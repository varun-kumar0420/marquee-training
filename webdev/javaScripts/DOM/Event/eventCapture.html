<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Propagation Demo</title>
    <style>
      /* Code for Propagation */
      #grand-parent {
        width: 300px;
        height: 300px;
        background-color: rgb(213, 37, 37);
      }

      #parent {
        width: 200px;
        height: 200px;
        background-color: rgb(200, 119, 119);
      }

      #child {
        width: 100px;
        height: 100px;
        background-color: rgb(162, 223, 7);
      }

      #grand-child {
        width: 50px;
        height: 50px;
        background-color: rgb(10, 187, 206);
      }

      #grand-parent,
      #parent,
      #child,
      #grand-child {
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h3>Event Propagation Example</h3>
    <div id="grand-parent">
      <div id="parent">
        <div id="child">
          <div id="grand-child"></div>
        </div>
      </div>
    </div>

    <!-- Link Example -->
    <h3>Here is the Link</h3>
    <a href="https://github.com/varun-kumar0420/" target="_blank">Click Here</a>

    <script>
      // Utility function to log events
      function logEvent(elementName, phase) {
        console.log(`${elementName} clicked during ${phase} phase`);
      }

      document
        .getElementById("grand-parent")
        .addEventListener(
          "click",
          () => logEvent("Grand Parent", "capturing"),
          true,
        );
      document
        .getElementById("parent")
        .addEventListener("click", () => logEvent("Parent", "capturing"), true);
      document
        .getElementById("child")
        .addEventListener("click", () => logEvent("Child", "capturing"), true);
      document
        .getElementById("grand-child")
        .addEventListener(
          "click",
          () => logEvent("Grand Child", "capturing"),
          true,
        );

      document
        .getElementById("grand-parent")
        .addEventListener("click", () => logEvent("Grand Parent", "bubbling"));
      document
        .getElementById("parent")
        .addEventListener("click", () => logEvent("Parent", "bubbling"));
      document
        .getElementById("child")
        .addEventListener("click", () => logEvent("Child", "bubbling"));
      document
        .getElementById("grand-child")
        .addEventListener("click", () => logEvent("Grand Child", "bubbling"));
    </script>
  </body>
</html>
